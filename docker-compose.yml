version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aitutor_db
    restart: always
    environment:
      POSTGRES_USER: aitutor_user
      POSTGRES_PASSWORD: aitutor_password
      POSTGRES_DB: aitutor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: